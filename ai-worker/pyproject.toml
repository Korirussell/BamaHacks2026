[project]
name = "bamahacks-ai-worker"
version = "0.1.0"
requires-python = ">=3.12,<3.13"
dependencies = [
  "torch>=2.8",
  "transformers>=5.0",
  "peft>=0.17",
  "accelerate>=1.10",
  "bitsandbytes>=0.47",
  "safetensors",
  "huggingface_hub",
  "httpx>=0.27",
  "python-dotenv>=1.0",
]

[tool.uv.sources]
torch = { index = "pytorch-cu128" }

[[tool.uv.index]]
name = "pytorch-cu128"
url = "https://download.pytorch.org/whl/cu128"
explicit = true
