name: Handoff
options:
  bundleIdPrefix: edu.ua.handoff
  deploymentTarget:
    iOS: "17.0"
settings:
  base:
    SWIFT_VERSION: "5.0"
    DEVELOPMENT_TEAM: ""
    CODE_SIGN_STYLE: Automatic
targets:
  Handoff:
    type: application
    platform: iOS
    sources:
      - path: Handoff
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: edu.ua.handoff.app
        GENERATE_INFOPLIST_FILE: YES
        INFOPLIST_KEY_UILaunchScreen_Generation: YES
        INFOPLIST_KEY_UIApplicationSceneManifest_Generation: YES
        INFOPLIST_KEY_CFBundleDisplayName: Handoff
        INFOPLIST_KEY_NSPhotoLibraryUsageDescription: Pick a photo or screenshot to turn into a listing.
        INFOPLIST_KEY_UISupportedInterfaceOrientations: UIInterfaceOrientationPortrait
        TARGETED_DEVICE_FAMILY: "1"
        MARKETING_VERSION: "1.0"
        CURRENT_PROJECT_VERSION: "1"
