name: Handoff
options:
  bundleIdPrefix: edu.ua.handoff
  deploymentTarget:
    iOS: "17.0"
settings:
  base:
    SWIFT_VERSION: "5.0"
    DEVELOPMENT_TEAM: ""
    CODE_SIGN_STYLE: Automatic
targets:
  Handoff:
    type: application
    platform: iOS
    sources:
      - path: Handoff
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: edu.ua.handoff.app
        TARGETED_DEVICE_FAMILY: "1"
        MARKETING_VERSION: "1.0"
        CURRENT_PROJECT_VERSION: "1"
    # Explicit `info:` (rather than GENERATE_INFOPLIST_FILE + INFOPLIST_KEY_* settings) so
    # NSAppTransportSecurity's nested dict can be expressed — INFOPLIST_KEY_ only supports flat values.
    info:
      path: Generated-Info.plist
      properties:
        CFBundleDisplayName: Handoff
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        UILaunchScreen: {}
        UIApplicationSceneManifest:
          UIApplicationSupportsMultipleScenes: false
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
        NSCalendarsWriteOnlyAccessUsageDescription: Handoff adds your meetup time and place to your calendar.
        NSCameraUsageDescription: Snap a photo of what you're selling.
        NSPhotoLibraryUsageDescription: Pick a photo or screenshot to turn into a listing.
        # Simulator shares the Mac's network; this lets the campus map WKWebView load
        # http://localhost:3000 (map-plan.md §4). Swap Config.mapBaseURL to an https
        # Vercel URL for a physical-device demo instead of widening this further.
        NSAppTransportSecurity:
          NSAllowsLocalNetworking: true
